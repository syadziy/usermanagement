# =========================
# APPLICATION
# =========================
spring:
  application:
    name: usermanagement
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  threads:
    virtual:
      enabled: true

# =========================
# DATABASE
# =========================
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/usermanagement}
    username: ${DB_USERNAME:admin}
    password: ${DB_PASSWORD:admin_macbook}
    hikari:
      connection-init-sql: SET TIME ZONE 'UTC'
      maximum-pool-size: ${DB_POOL_MAX_SIZE:20}
      minimum-idle: ${DB_POOL_MIN_IDLE:2}
  flyway:
    enabled: true
    locations: classpath:db/migration
    placeholders:
      defaultSuperadminPasswordHash: ${DEFAULT_SUPERADMIN_PASSWORD_HASH:}

# =========================
# SERVER
# =========================
server:
  port: ${SERVER_PORT:9005}
  shutdown: graceful

# =========================
# USER MANAGEMENT
# =========================
usermanagement:
  jwt:
    issuer: ${JWT_ISSUER:http://localhost:9005}
    key-id: ${JWT_KEY_ID:usermanagement-local}
    private-key: ${JWT_PRIVATE_KEY:}
    public-key: ${JWT_PUBLIC_KEY:}
    generate-ephemeral-key: ${JWT_GENERATE_EPHEMERAL_KEY:false}
    audiences: ${JWT_AUDIENCES:api-gateway}
  registration:
    enabled: ${TENANT_REGISTRATION_ENABLED:true}

# =========================
# SHARED SDK
# =========================
sdk:
  timezone: ${APP_TIMEZONE:UTC}
  web:
    exception-handler:
      enabled: true
  security:
    enabled: false
    method-security-enabled: false
    cors:
      enabled: false
  logging:
    structured:
      enabled: true
      format: ecs
      auto-configure-format: true
      trace-header: X-Correlation-Id
      trace-response-header: true
    aspect:
      enabled: true
      packages: com.mac.usermanagement.service,com.mac.usermanagement.repository
  openapi:
    enabled: true
    title: User Management API
    description: Multi-tenant identity and action-level authorization service
    version: 1.0.0

# =========================
# MANAGEMENT / ACTUATOR
# =========================
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:0.1}

# =========================
# LOGGING
# =========================
logging:
  level:
    root: ${LOG_LEVEL_ROOT:INFO}
    com.mac.usermanagement: ${LOG_LEVEL_APPLICATION:INFO}
    org.springframework.security: ${LOG_LEVEL_SECURITY:INFO}
